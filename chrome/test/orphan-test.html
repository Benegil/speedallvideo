<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Test overlay orphelin</title></head><body style="height:3000px">
<h3>Vidéo retirée / remplacée (YouTube) : pas de « Speed » en double</h3>
<div id="box"><video id="v1" src="video.mp4" width="320" height="180" muted autoplay loop></video></div>
<ol id="results"></ol>
<script>
/* ================= Simulation de browser.* =================
   Fidèle au comportement réel testé :
   - le background est « froid » au démarrage (speed=1.0) et ne charge son
     stockage qu'asynchronement, puis re-diffuse à tous les onglets ;
   - storage.sync.set notifie onChanged (comme Firefox) ;
   - runtime.sendMessage(msg, cb) répond via callback ET renvoie une Promise. */
const store = { defaultSpeed: 1.0, speedStep: '0.25', forceOneX: false };
const bgListeners = [];   // listeners du background SIMULÉ (ci-dessous)
const tabListeners = [];  // listeners des « onglets » : content.js s'y enregistre
let detMsgs = 0;          // messages setSpeed reçus avec fromDetection

const bclamp = s => Math.min(4, Math.max(0.25, s));
function broadcast() {
    tabListeners.forEach(fn => fn({ action: 'setSpeed', speed: bg.speed }));
}
const bg = {
    speed: 1.0, // froid : pas encore chargé le stockage (comme au rechargement d'extension)
    handle(msg, cb) {
        if (msg.action === 'setSpeed') {
            this.speed = bclamp(msg.speed);
            store.defaultSpeed = this.speed;
            broadcast();
        } else if (msg.action === 'getCurrentSpeed') {
            cb && cb({ speed: this.speed });
        }
    },
    /* Rechargement simulé : le background repart à 1.0 puis recharge son stockage. */
    reload() {
        this.speed = 1.0;
        setTimeout(() => {
            if (store.defaultSpeed) {
                this.speed = bclamp(store.defaultSpeed);
                broadcast();
            }
        }, 50);
    }
};

const onChangedListeners = [];
window.browser = {
    storage: {
        sync: {
            get(keys) {
                const out = {};
                (Array.isArray(keys) ? keys : [keys]).forEach(k => { if (k in store) out[k] = store[k]; });
                return Promise.resolve(out);
            },
            set(obj) {
                const changes = {};
                for (const k in obj) { store[k] = obj[k]; changes[k] = { newValue: obj[k] }; }
                onChangedListeners.forEach(fn => fn(changes));
                return Promise.resolve();
            }
        },
        onChanged: { addListener(fn) { onChangedListeners.push(fn); } }
    },
    runtime: {
        onMessage: { addListener(fn) { tabListeners.push(fn); } }, // content.js tourne dans un « onglet »
        sendMessage(msg, cb) {
            // Onglet → background : seuls les listeners du background sont appelés.
            bgListeners.forEach(fn => fn(msg));
            if (msg.action === 'setSpeed' && msg.fromDetection) detMsgs++;
            cb && cb({ speed: bg.speed });
            return Promise.resolve({ speed: bg.speed });
        }
    },
    tabs: {
        query() { return Promise.resolve([{ id: 1 }]); },
        sendMessage(id, msg) { tabListeners.forEach(fn => fn(msg)); return Promise.resolve(); },
        onCreated: { addListener() {} }
    }
};

/* Le background « réel » est simulé par la même logique que background.js :
   il écoute les messages, met à jour vitesse + stockage et re-diffuse. */
bgListeners.push(msg => bg.handle(msg));


store.defaultSpeed = 1.5;
document.write('<script src="../content.js"><\/script>');
</script>
<script>
(async () => {
    const sleep = ms => new Promise(r => setTimeout(r, ms));
    await sleep(1200);
    // YouTube remplace son <video> (navigation, aperçu) puis on défile à la molette
    const old = document.getElementById('v1');
    old.remove();
    const v2 = document.createElement('video');
    v2.src = 'video.mp4'; v2.width = 320; v2.height = 180; v2.muted = true;
    document.getElementById('box').appendChild(v2);
    await sleep(300);
    window.scrollBy(0, 40); await sleep(1300);
    const labels = [...document.querySelectorAll('.sav-overlay')]
        .filter(o => o.style.display !== 'none').map(o => o.textContent);
    const ok = labels.length === 1;
    const li = document.createElement('li');
    li.textContent = `M — vidéo remplacée + molette : 1 seul badge — ${ok ? 'OK' : 'ÉCHEC'} (badges=${labels.join('|')})`;
    document.getElementById('results').appendChild(li);
    for (let i = 0; i < 9; i++) document.getElementById('results').appendChild(document.createElement('li'));
})();
</script></body></html>
