<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Test signal sonore</title>
<style>body{margin:0;background:#222;color:#eee;font-family:sans-serif}</style></head><body>
<p>Signal sonore : option, hauteur selon la vitesse, automatique quand la vidéo elle-même est en plein écran</p>
<video id="v1" src="video.mp4" width="480" height="270" muted autoplay loop></video>
<button id="fsbtn">plein écran (vidéo)</button>
<ol id="results"></ol>
<script>
/* Enregistreur à la place de l'audio : on note chaque blip (fréquences de départ / d'arrivée). */
const blips = [];
class FakeCtx { constructor() { this.currentTime = 0; this.state = 'running'; this.destination = {}; }
    resume() {} createGain() { return { gain: { setValueAtTime() {}, exponentialRampToValueAtTime() {} }, connect() {} }; }
    createOscillator() { const b = {}; blips.push(b); return { type: '', connect() {}, start() {}, stop() {},
        frequency: { setValueAtTime(f) { b.from = f; }, exponentialRampToValueAtTime(f) { b.to = f; } } }; } }
window.AudioContext = FakeCtx;
/* ================= Simulation de browser.* =================
   Fidèle au comportement réel testé :
   - le background est « froid » au démarrage (speed=1.0) et ne charge son
     stockage qu'asynchronement, puis re-diffuse à tous les onglets ;
   - storage.sync.set notifie onChanged (comme Firefox) ;
   - runtime.sendMessage(msg, cb) répond via callback ET renvoie une Promise. */
const store = { defaultSpeed: 1.0, speedStep: '0.25', forceOneX: false };
const bgListeners = [];   // listeners du background SIMULÉ (ci-dessous)
const tabListeners = [];  // listeners des « onglets » : content.js s'y enregistre
let detMsgs = 0;          // messages setSpeed reçus avec fromDetection

const bclamp = s => Math.min(4, Math.max(0.25, s));
function broadcast() {
    tabListeners.forEach(fn => fn({ action: 'setSpeed', speed: bg.speed }));
}
const bg = {
    speed: 1.0, // froid : pas encore chargé le stockage (comme au rechargement d'extension)
    handle(msg, cb) {
        if (msg.action === 'setSpeed') {
            this.speed = bclamp(msg.speed);
            store.defaultSpeed = this.speed;
            broadcast();
        } else if (msg.action === 'getCurrentSpeed') {
            cb && cb({ speed: this.speed });
        }
    },
    /* Rechargement simulé : le background repart à 1.0 puis recharge son stockage. */
    reload() {
        this.speed = 1.0;
        setTimeout(() => {
            if (store.defaultSpeed) {
                this.speed = bclamp(store.defaultSpeed);
                broadcast();
            }
        }, 50);
    }
};

const onChangedListeners = [];
window.browser = {
    storage: {
        sync: {
            get(keys) {
                const out = {};
                (Array.isArray(keys) ? keys : [keys]).forEach(k => { if (k in store) out[k] = store[k]; });
                return Promise.resolve(out);
            },
            set(obj) {
                const changes = {};
                for (const k in obj) { store[k] = obj[k]; changes[k] = { newValue: obj[k] }; }
                onChangedListeners.forEach(fn => fn(changes));
                return Promise.resolve();
            }
        },
        onChanged: { addListener(fn) { onChangedListeners.push(fn); } }
    },
    runtime: {
        onMessage: { addListener(fn) { tabListeners.push(fn); } }, // content.js tourne dans un « onglet »
        sendMessage(msg, cb) {
            // Onglet → background : seuls les listeners du background sont appelés.
            bgListeners.forEach(fn => fn(msg));
            if (msg.action === 'setSpeed' && msg.fromDetection) detMsgs++;
            cb && cb({ speed: bg.speed });
            return Promise.resolve({ speed: bg.speed });
        }
    },
    tabs: {
        query() { return Promise.resolve([{ id: 1 }]); },
        sendMessage(id, msg) { tabListeners.forEach(fn => fn(msg)); return Promise.resolve(); },
        onCreated: { addListener() {} }
    }
};

/* Le background « réel » est simulé par la même logique que background.js :
   il écoute les messages, met à jour vitesse + stockage et re-diffuse. */
bgListeners.push(msg => bg.handle(msg));


store.defaultSpeed = 1.5;
document.write('<script src="../sound.js"><\/script><script src="../content.js"><\/script>');
</script>
<script>
(async () => {
    const sleep = ms => new Promise(r => setTimeout(r, ms));
    const ol = document.getElementById('results');
    const add = (name, ok, d) => { const li = document.createElement('li'); li.textContent = `${name} — ${ok ? 'OK' : 'ÉCHEC'} (${d})`; ol.appendChild(li); };
    const key = k => document.dispatchEvent(new KeyboardEvent('keydown', { key: k, bubbles: true, cancelable: true }));
    await sleep(1300);
    key('d'); await sleep(100); // 1.5 → 1.75, rien en stockage
    add('T0 — son activé par défaut (rien en mémoire)', blips.length === 1, `blips=${blips.length}`);
    blips.length = 0;
    await browser.storage.sync.set({ soundFx: false });
    key('d'); await sleep(100);
    add('T1 — option désactivée : silence', blips.length === 0, `blips=${blips.length}`);
    await browser.storage.sync.set({ soundFx: true });
    key('d'); await sleep(100); // 2 → 2.25
    const up = blips[blips.length - 1];
    add('T2 — accélérer : blip qui monte (2x → 2.25x)', blips.length === 1 && up.from === 880 && up.to === 440 * 2.25, `${up && up.from} → ${up && up.to} Hz`);
    key('s'); await sleep(100); // 2 → 1.75
    const down = blips[blips.length - 1];
    add('T3 — ralentir : blip qui descend', blips.length === 2 && down.to < down.from, `${down && down.from} → ${down && down.to} Hz`);
    await browser.storage.sync.set({ soundFx: false });
    window.__wantFs = true; // la VIDÉO elle-même en plein écran : aucun affichage possible
    await new Promise(r => document.addEventListener('fullscreenchange', r, { once: true }));
    key('d'); await sleep(100);
    add('T4 — vidéo elle-même en plein écran : blip même sans l\'option', blips.length === 3, `blips=${blips.length}, plein écran=${document.fullscreenElement && document.fullscreenElement.tagName}`);
    await document.exitFullscreen().catch(() => {});
    for (let i = 0; i < 6; i++) ol.appendChild(document.createElement('li'));
})();
document.getElementById('fsbtn').addEventListener('click', () => document.getElementById('v1').requestFullscreen());
</script></body></html>
