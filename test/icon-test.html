<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>body{background:#444;display:flex;flex-direction:column;gap:12px;padding:16px;font-family:sans-serif;color:#fff}</style></head>
<body>
<div style="display:flex;gap:16px;align-items:center">
  <span>1.75x :</span><img id="a32" width="96" height="96"><img id="a48" width="144" height="144">
</div>
<div style="display:flex;gap:16px;align-items:center">
  <span>2x :</span><img id="b32" width="96" height="96"><img id="b48" width="144" height="144">
</div>
<div style="display:flex;gap:16px;align-items:center">
  <span>0.25x :</span><img id="c32" width="96" height="96"><img id="c48" width="144" height="144">
</div>
<script>
async function drawSpeedIcon(size, speed) {
    const canvas = document.createElement('canvas');
    canvas.width = size; canvas.height = size;
    const ctx = canvas.getContext('2d');
    const base = new Image();
    base.src = `../icon${size}.png`;
    await new Promise(r => base.onload = r);
    ctx.drawImage(base, 0, 0, size, size);
    const r = size / 2;
    ctx.save();
    ctx.beginPath();
    ctx.arc(r, r, r - Math.max(1, size * 0.03), 0, Math.PI * 2);
    ctx.clip();
    ctx.fillStyle = 'rgba(0, 0, 0, 0.55)';
    ctx.fillRect(0, 0, size, size);
    ctx.restore();
    const label = `${speed}x`;
    let fontSize = Math.floor(size * 0.8);
    ctx.font = `bold ${fontSize}px sans-serif`;
    const maxW = size * 0.72;
    const textW = ctx.measureText(label).width;
    if (textW > maxW) {
        fontSize = Math.max(4, Math.floor(fontSize * maxW / textW));
        ctx.font = `bold ${fontSize}px sans-serif`;
    }
    ctx.fillStyle = '#ffffff';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(label, size / 2, size / 2 + fontSize * 0.05);
    return canvas.toDataURL('image/png');
}
(async () => {
    document.getElementById('a32').src = await drawSpeedIcon(32, 1.75);
    document.getElementById('a48').src = await drawSpeedIcon(48, 1.75);
    document.getElementById('b32').src = await drawSpeedIcon(32, 2);
    document.getElementById('b48').src = await drawSpeedIcon(48, 2);
    document.getElementById('c32').src = await drawSpeedIcon(32, 0.25);
    document.getElementById('c48').src = await drawSpeedIcon(48, 0.25);
})();
</script>
</body></html>
