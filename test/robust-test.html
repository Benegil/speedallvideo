<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Test cas difficiles</title>
<style>body{margin:0;background:#222;color:#eee;font-family:sans-serif}#fsbox{width:480px;height:270px;background:#000}</style></head><body>
<p>Cas difficiles : Shadow DOM, vidéo créée en JS, épisode suivant (nouvelle source), plein écran</p>
<div id="slot"></div>
<div id="fsbox"><video id="vf" src="video.mp4" width="480" height="270" muted autoplay loop></video></div>
<button id="fsbtn">plein écran</button>
<ol id="results"></ol>
<script>
/* ================= Simulation de browser.* =================
   Fidèle au comportement réel testé :
   - le background est « froid » au démarrage (speed=1.0) et ne charge son
     stockage qu'asynchronement, puis re-diffuse à tous les onglets ;
   - storage.sync.set notifie onChanged (comme Firefox) ;
   - runtime.sendMessage(msg, cb) répond via callback ET renvoie une Promise. */
const store = { defaultSpeed: 1.0, speedStep: '0.25', forceOneX: false };
const bgListeners = [];   // listeners du background SIMULÉ (ci-dessous)
const tabListeners = [];  // listeners des « onglets » : content.js s'y enregistre
let detMsgs = 0;          // messages setSpeed reçus avec fromDetection

const bclamp = s => Math.min(4, Math.max(0.25, s));
function broadcast() {
    tabListeners.forEach(fn => fn({ action: 'setSpeed', speed: bg.speed }));
}
const bg = {
    speed: 1.0, // froid : pas encore chargé le stockage (comme au rechargement d'extension)
    handle(msg, cb) {
        if (msg.action === 'setSpeed') {
            this.speed = bclamp(msg.speed);
            store.defaultSpeed = this.speed;
            broadcast();
        } else if (msg.action === 'getCurrentSpeed') {
            cb && cb({ speed: this.speed });
        }
    },
    /* Rechargement simulé : le background repart à 1.0 puis recharge son stockage. */
    reload() {
        this.speed = 1.0;
        setTimeout(() => {
            if (store.defaultSpeed) {
                this.speed = bclamp(store.defaultSpeed);
                broadcast();
            }
        }, 50);
    }
};

const onChangedListeners = [];
window.browser = {
    storage: {
        sync: {
            get(keys) {
                const out = {};
                (Array.isArray(keys) ? keys : [keys]).forEach(k => { if (k in store) out[k] = store[k]; });
                return Promise.resolve(out);
            },
            set(obj) {
                const changes = {};
                for (const k in obj) { store[k] = obj[k]; changes[k] = { newValue: obj[k] }; }
                onChangedListeners.forEach(fn => fn(changes));
                return Promise.resolve();
            }
        },
        onChanged: { addListener(fn) { onChangedListeners.push(fn); } }
    },
    runtime: {
        onMessage: { addListener(fn) { tabListeners.push(fn); } }, // content.js tourne dans un « onglet »
        sendMessage(msg, cb) {
            // Onglet → background : seuls les listeners du background sont appelés.
            bgListeners.forEach(fn => fn(msg));
            if (msg.action === 'setSpeed' && msg.fromDetection) detMsgs++;
            cb && cb({ speed: bg.speed });
            return Promise.resolve({ speed: bg.speed });
        }
    },
    tabs: {
        query() { return Promise.resolve([{ id: 1 }]); },
        sendMessage(id, msg) { tabListeners.forEach(fn => fn(msg)); return Promise.resolve(); },
        onCreated: { addListener() {} }
    }
};

/* Le background « réel » est simulé par la même logique que background.js :
   il écoute les messages, met à jour vitesse + stockage et re-diffuse. */
bgListeners.push(msg => bg.handle(msg));


store.defaultSpeed = 1.5;
document.write('<script src="../content.js"><\/script>');
</script>
<script>
(async () => {
    const sleep = ms => new Promise(r => setTimeout(r, ms));
    const ol = document.getElementById('results');
    const add = (name, ok, d) => { const li = document.createElement('li'); li.textContent = `${name} — ${ok ? 'OK' : 'ÉCHEC'} (${d})`; ol.appendChild(li); };
    await sleep(1300);

    /* R1. Lecteur Web Component : <video> dans un shadow root (Reddit…) */
    class Player extends HTMLElement { constructor() { super(); const r = this.attachShadow({ mode: 'open' });
        r.innerHTML = '<video src="video.mp4" width="320" height="180" muted autoplay loop></video>'; } }
    customElements.define('x-player', Player);
    const xp = document.createElement('x-player'); document.getElementById('slot').appendChild(xp);
    await sleep(400);
    const sv = xp.shadowRoot.querySelector('video');
    add('R1 — vidéo dans un Shadow DOM : vitesse appliquée', Math.abs(sv.playbackRate - 1.5) < 0.001, `rate=${sv.playbackRate}`);
    add('R1b — badge sur la vidéo du Shadow DOM', !!(sv._savLabel && sv._savLabel.textContent === 'Speed 1.5x'), `badge=${sv._savLabel && sv._savLabel.textContent}`);

    /* R2. Épisode suivant : même <video>, nouvelle source → load() remet à defaultPlaybackRate */
    const vf = document.getElementById('vf');
    vf.src = 'video.mp4?ep=2'; vf.load();
    await new Promise(r => vf.addEventListener('loadedmetadata', r, { once: true }));
    const rateAfterLoad = vf.playbackRate;
    await sleep(1500); // laisse passer un tour de détection
    add('R2 — épisode suivant : vitesse conservée (pas de retour à 1x)', Math.abs(rateAfterLoad - 1.5) < 0.001 && Math.abs(vf.playbackRate - 1.5) < 0.001 && Math.abs(store.defaultSpeed - 1.5) < 0.001,
        `juste après load=${rateAfterLoad}, 1.5 s après=${vf.playbackRate}, mémoire=${store.defaultSpeed}`);

    /* R3. Vidéo créée en JS : prise en charge immédiate (pas d'attente de la boucle) */
    const nv = document.createElement('video'); nv.muted = true; nv.width = 200; nv.height = 112;
    document.getElementById('slot').appendChild(nv); nv.src = 'video.mp4'; nv.play().catch(() => {});
    await new Promise(r => nv.addEventListener('playing', r, { once: true }));
    await sleep(50);
    add('R3 — vidéo créée en JS : vitesse dès la lecture', Math.abs(nv.playbackRate - 1.5) < 0.001, `rate=${nv.playbackRate}`);

    /* R4. Plein écran d'un conteneur de lecteur : le badge doit y être */
    window.__wantFs = true;
    await new Promise(r => document.addEventListener('fullscreenchange', r, { once: true }));
    await sleep(300);
    const o = vf._savOverlay;
    add('R4 — plein écran : badge dans l\'élément plein écran', !!o && document.getElementById('fsbox').contains(o) && o.style.visibility !== 'hidden',
        `parent=${o && o.parentNode && (o.parentNode.id || o.parentNode.tagName)}`);
    await document.exitFullscreen().catch(() => {});
    await sleep(200);
    add('R4b — sortie du plein écran : badge rendu à la page', !!o && o.parentNode === document.body, `parent=${o && o.parentNode && (o.parentNode.id || o.parentNode.tagName)}`);
    for (let i = 0; i < 4; i++) ol.appendChild(document.createElement('li'));
})();
document.getElementById('fsbtn').addEventListener('click', () => document.getElementById('fsbox').requestFullscreen());
</script></body></html>
