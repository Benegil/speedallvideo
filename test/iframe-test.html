<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Test vidéo dans une iframe</title>
<style>body{margin:0;background:#222;color:#eee;font-family:sans-serif}iframe{border:0;width:520px;height:320px;display:block}</style></head><body>
<p>Lecteur dans une iframe (anime-sama, sites de streaming, vidéos intégrées) : manifest « all_frames » → content.js tourne dans chaque frame</p>
<iframe id="f" srcdoc='<body style="margin:0;background:#000"><video id="v" src="video.mp4" width="480" height="270" muted autoplay loop></video></body>'></iframe>
<ol id="results"></ol>
<script>
/* ================= Simulation de browser.* =================
   Fidèle au comportement réel testé :
   - le background est « froid » au démarrage (speed=1.0) et ne charge son
     stockage qu'asynchronement, puis re-diffuse à tous les onglets ;
   - storage.sync.set notifie onChanged (comme Firefox) ;
   - runtime.sendMessage(msg, cb) répond via callback ET renvoie une Promise. */
const store = { defaultSpeed: 1.0, speedStep: '0.25', forceOneX: false };
const bgListeners = [];   // listeners du background SIMULÉ (ci-dessous)
const tabListeners = [];  // listeners des « onglets » : content.js s'y enregistre
let detMsgs = 0;          // messages setSpeed reçus avec fromDetection

const bclamp = s => Math.min(4, Math.max(0.25, s));
function broadcast() {
    tabListeners.forEach(fn => fn({ action: 'setSpeed', speed: bg.speed }));
}
const bg = {
    speed: 1.0, // froid : pas encore chargé le stockage (comme au rechargement d'extension)
    handle(msg, cb) {
        if (msg.action === 'setSpeed') {
            this.speed = bclamp(msg.speed);
            store.defaultSpeed = this.speed;
            broadcast();
        } else if (msg.action === 'getCurrentSpeed') {
            cb && cb({ speed: this.speed });
        }
    },
    /* Rechargement simulé : le background repart à 1.0 puis recharge son stockage. */
    reload() {
        this.speed = 1.0;
        setTimeout(() => {
            if (store.defaultSpeed) {
                this.speed = bclamp(store.defaultSpeed);
                broadcast();
            }
        }, 50);
    }
};

const onChangedListeners = [];
window.browser = {
    storage: {
        sync: {
            get(keys) {
                const out = {};
                (Array.isArray(keys) ? keys : [keys]).forEach(k => { if (k in store) out[k] = store[k]; });
                return Promise.resolve(out);
            },
            set(obj) {
                const changes = {};
                for (const k in obj) { store[k] = obj[k]; changes[k] = { newValue: obj[k] }; }
                onChangedListeners.forEach(fn => fn(changes));
                return Promise.resolve();
            }
        },
        onChanged: { addListener(fn) { onChangedListeners.push(fn); } }
    },
    runtime: {
        onMessage: { addListener(fn) { tabListeners.push(fn); } }, // content.js tourne dans un « onglet »
        sendMessage(msg, cb) {
            // Onglet → background : seuls les listeners du background sont appelés.
            bgListeners.forEach(fn => fn(msg));
            if (msg.action === 'setSpeed' && msg.fromDetection) detMsgs++;
            cb && cb({ speed: bg.speed });
            return Promise.resolve({ speed: bg.speed });
        }
    },
    tabs: {
        query() { return Promise.resolve([{ id: 1 }]); },
        sendMessage(id, msg) { tabListeners.forEach(fn => fn(msg)); return Promise.resolve(); },
        onCreated: { addListener() {} }
    }
};

/* Le background « réel » est simulé par la même logique que background.js :
   il écoute les messages, met à jour vitesse + stockage et re-diffuse. */
bgListeners.push(msg => bg.handle(msg));


/* Comme Firefox avec all_frames : une instance de content.js dans la page ET dans l'iframe ;
   tabs.sendMessage (sans frameId) atteint toutes les frames → mêmes tabListeners. */
store.defaultSpeed = 1.5;
document.write('<script src="../content.js"><\/script>');
</script>
<script>
(async () => {
    const sleep = ms => new Promise(r => setTimeout(r, ms));
    const ol = document.getElementById('results');
    const add = (name, ok, d) => { const li = document.createElement('li'); li.textContent = `${name} — ${ok ? 'OK' : 'ÉCHEC'} (${d})`; ol.appendChild(li); };
    const f = document.getElementById('f');
    await new Promise(r => f.contentDocument && f.contentDocument.readyState === 'complete' ? r() : f.addEventListener('load', r, { once: true }));
    const w = f.contentWindow, d = f.contentDocument;
    w.browser = window.browser; // même API simulée (le background est partagé)
    const s = d.createElement('script'); s.src = new URL('../content.js', location.href).href;
    await new Promise(r => { s.onload = r; d.head.appendChild(s); });
    await sleep(1300);
    const v = d.getElementById('v');
    add('Q1 — vidéo dans l\'iframe : vitesse mémorisée appliquée', Math.abs(v.playbackRate - 1.5) < 0.001, `rate=${v.playbackRate}`);
    add('Q2 — badge affiché dans l\'iframe', !!d.querySelector('.sav-overlay .sav-label') && d.querySelector('.sav-overlay .sav-label').textContent === 'Speed 1.5x', `badge=${d.querySelector('.sav-label') && d.querySelector('.sav-label').textContent}`);
    document.dispatchEvent(new KeyboardEvent('keydown', { key: 'd', bubbles: true, cancelable: true })); // focus sur la page principale
    await sleep(300);
    add('Q3 — raccourci D tapé dans la page → vidéo de l\'iframe à 1.75x', Math.abs(v.playbackRate - 1.75) < 0.001, `rate=${v.playbackRate}`);
    d.dispatchEvent(new KeyboardEvent('keydown', { key: 's', bubbles: true, cancelable: true })); // focus dans le lecteur
    await sleep(300);
    add('Q4 — raccourci S tapé dans le lecteur (iframe) → 1.5x', Math.abs(v.playbackRate - 1.5) < 0.001, `rate=${v.playbackRate}`);
    for (let i = 0; i < 6; i++) ol.appendChild(document.createElement('li'));
})();
</script></body></html>
