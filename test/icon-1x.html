<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>body{background:#444;padding:16px;font-family:sans-serif;color:#fff} .row{display:flex;gap:8px;align-items:center;margin-bottom:14px} .lbl{width:70px}</style></head>
<body>
<div class="row"><span class="lbl">1x :</span><img id="a16" width="48" height="48"><img id="a32" width="96" height="96"><img id="a48" width="144" height="144"></div>
<script>
function drawSpeedIcon(size, speed, offset) {
    const canvas = document.createElement('canvas');
    canvas.width = size; canvas.height = size;
    const ctx = canvas.getContext('2d');
    const radius = Math.max(2, Math.round(size * 0.15));
    const path = () => {
        ctx.beginPath();
        if (ctx.roundRect) ctx.roundRect(0.5, 0.5, size - 1, size - 1, radius);
        else ctx.rect(0.5, 0.5, size - 1, size - 1);
    };
    path(); ctx.fillStyle = '#1e1e1e'; ctx.fill();
    path(); ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1; ctx.stroke();
    const label = `${speed}x`;
    let fontSize = Math.max(4, size - 2);
    ctx.font = `bold ${fontSize}px sans-serif`;
    const textW = ctx.measureText(label).width;
    ctx.save(); path(); ctx.clip();
    ctx.fillStyle = '#ffffff'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    if (label.length <= 2) {
        ctx.fillText(label, (size - textW) / 2, size / 2);
    } else {
        const innerW = size - 2;
        const period = textW + innerW;
        let x = innerW - (offset % period);
        if (x < -textW) x += period;
        ctx.fillText(label, x, size / 2);
    }
    ctx.restore();
    return canvas.toDataURL('image/png');
}
document.getElementById('a16').src = drawSpeedIcon(16, 1, 0);
document.getElementById('a32').src = drawSpeedIcon(32, 1, 0);
document.getElementById('a48').src = drawSpeedIcon(48, 1, 0);
</script>
</body></html>
