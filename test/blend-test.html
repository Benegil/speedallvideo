<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Test mix-blend-mode</title>
<style>
  body { margin: 0; font-family: sans-serif; }
  .zone { width: 400px; height: 200px; position: relative; overflow: hidden; margin-bottom: 1rem; }
  .zone.fixed { background: linear-gradient(90deg, #000 30%, #fff 70%); }
  .zone.abs { background: linear-gradient(90deg, #000 30%, #fff 70%); }
  .ovl-fixed { position: fixed; width: 400px; height: 200px; overflow: hidden; pointer-events: none; z-index: 2147483647; }
  .ovl-abs { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
  .lbl { position: absolute; top: 6px; right: 6px; font-size: 10px; font-weight: 600; color: #fff; opacity: 0.85; mix-blend-mode: difference; }
  h3 { margin: 0 0 .5rem 0; }
</style>
</head>
<body>
<h3>Cas 1 : overlay position:fixed (avec z-index) — le texte change-t-il de couleur sur le fond clair ?</h3>
<div class="zone fixed" id="z1"></div>

<h3 style="margin-top:2rem">Cas 2 : overlay position:absolute sans z-index — idem ?</h3>
<div class="zone abs" id="z2"><div class="ovl-abs"><span class="lbl">Speed 2x</span></div></div>

<script>
// Cas 1 : fixed, calé sur #z1
const z1 = document.getElementById('z1');
const r = z1.getBoundingClientRect();
const ovl = document.createElement('div');
ovl.className = 'ovl-fixed';
ovl.style.top = r.top + 'px';
ovl.style.left = r.left + 'px';
ovl.innerHTML = '<span class="lbl">Speed 2x</span>';
document.body.appendChild(ovl);
</script>
</body>
</html>
