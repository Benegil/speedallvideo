<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>SpeedAllVideo — Test overlays (suivi scroll/resize)</title>
<style>
  body { font-family: sans-serif; margin: 0; background: #1e1e1e; color: #eee; }
  .zone { height: 250vh; padding: 4rem; box-sizing: border-box; }
  video { width: 480px; display: block; margin-bottom: 30vh; background: #000; }
  h1 { font-size: 1.3rem; }
</style>
</head>
<body>
<div class="zone">
  <h1>Test overlays — défiler : le badge doit suivre la vidéo (pas l'écran)</h1>
  <video id="v1" controls src="video.mp4"></video>
  <p style="margin-top:30vh;">Encore de la page pour forcer le scroll…</p>
</div>

<script>
/* Simulation de browser.* minimale (même logique que test/index.html) */
const store = { defaultSpeed: 1.0, speedStep: '0.25', forceOneX: false };
const bgListeners = [], tabListeners = [], onChangedListeners = [];
const bclamp = s => Math.min(4, Math.max(0.25, s));
function broadcast() { tabListeners.forEach(fn => fn({ action: 'setSpeed', speed: bg.speed })); }
const bg = {
    speed: 1.0,
    handle(msg) {
        if (msg.action === 'setSpeed') {
            this.speed = bclamp(msg.speed);
            store.defaultSpeed = this.speed;
            broadcast();
        }
    }
};
bgListeners.push(msg => bg.handle(msg));

window.browser = {
    storage: {
        sync: {
            get(keys) {
                const out = {};
                (Array.isArray(keys) ? keys : [keys]).forEach(k => { if (k in store) out[k] = store[k]; });
                return Promise.resolve(out);
            },
            set(obj) {
                const changes = {};
                for (const k in obj) { store[k] = obj[k]; changes[k] = { newValue: obj[k] }; }
                onChangedListeners.forEach(fn => fn(changes));
                return Promise.resolve();
            }
        },
        onChanged: { addListener(fn) { onChangedListeners.push(fn); } }
    },
    runtime: {
        onMessage: { addListener(fn) { bgListeners.push(fn); } },
        sendMessage(msg, cb) {
            bgListeners.forEach(fn => fn(msg));
            if (msg.action === 'setSpeed') broadcast();
            cb && cb({ speed: bg.speed });
            return Promise.resolve({ speed: bg.speed });
        }
    },
    tabs: {
        query() { return Promise.resolve([{ id: 1 }]); },
        sendMessage(id, msg) { tabListeners.forEach(fn => fn(msg)); return Promise.resolve(); },
        onCreated: { addListener() {} }
    }
};

/* Vérification automatique : l'overlay doit être calé sur le rect de la vidéo. */
const v1 = document.getElementById('v1');
let fails = 0;
setInterval(() => {
    const o = v1._savOverlay;
    if (!o) return;
    const r = v1.getBoundingClientRect();
    const ok = Math.abs(parseFloat(o.style.top) - r.top) < 2 &&
               Math.abs(parseFloat(o.style.left) - r.left) < 2 &&
               Math.abs(parseFloat(o.style.width) - r.width) < 2 &&
               o.style.display === 'block';
    if (!ok) {
        fails++;
        console.warn(`overlay décalé (top=${o.style.top} vs ${r.top})`);
    }
}, 400);
window.addEventListener('beforeunload', () => {
    console.log(fails ? `❌ ${fails} décalage(s)` : '✅ overlay toujours calé sur la vidéo');
});
</script>
</body>
</html>
