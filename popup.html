<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SpeedAllVideo</title>
<style>
  :root {
    --bg: #e9eaec;
    --card: #ffffff;
    --text: #222;
    --sub: #555;
    --border: #dcdfe3;
    --primary: #2b7de9;
    --primary-h: #1f68c9;
    --accent: #f2733d;
    --accent-h: #e0622c;
    --btn-bg: #ffffff;
    --btn-text: #222;
    --btn-border: #d4d7dc;
    --track: #d9dce1;
    --key-bg: #eceef1;
    --key-border: #cfd3d9;
    --key-text: #333;
    --ok: #28a745;
    --shadow: 0 1px 4px rgba(0,0,0,.10);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #191b1e;
      --card: #2a2d31;
      --text: #e4e6e9;
      --sub: #9aa0a8;
      --border: #3d4147;
      --primary: #6ea8fe;
      --primary-h: #5a93e0;
      --accent: #ff8b4d;
      --accent-h: #f2733d;
      --btn-bg: #34383d;
      --btn-text: #e4e6e9;
      --btn-border: #4a4f56;
      --track: #4a4f56;
      --key-bg: #3a3e44;
      --key-border: #565b62;
      --key-text: #e4e6e9;
      --ok: #5cdb7a;
      --shadow: 0 1px 4px rgba(0,0,0,.35);
    }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    width: 340px;
    padding: 16px 12px;
  }

  .header { margin-bottom: 12px; padding: 0 2px; }
  h1 { font-size: 17px; font-weight: 700; color: var(--primary); }

  .card {
    background: var(--card);
    border-radius: 12px;
    box-shadow: var(--shadow);
    padding: 16px 14px;
  }
  .card + .card { margin-top: 12px; }

  .label {
    font-size: 12px;
    font-weight: 700;
    color: var(--sub);
    text-transform: uppercase;
    letter-spacing: .5px;
    margin-bottom: 8px;
  }

  .speed {
    text-align: center;
    font-size: 42px;
    font-weight: 700;
    color: var(--primary);
    line-height: 1.1;
    margin-bottom: 12px;
  }

  .row { display: flex; align-items: center; gap: 10px; }

  .step-btn {
    width: 32px; height: 32px;
    border-radius: 50%;
    border: none;
    background: var(--primary);
    color: #fff;
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    line-height: 1; text-align: center;
    flex-shrink: 0;
    transition: background .15s;
  }
  .step-btn:hover { background: var(--primary-h); }

  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    flex: 1; min-width: 0;
    height: 6px; border-radius: 3px;
    background: var(--track);
    outline: none;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 18px; height: 18px; border-radius: 50%;
    background: var(--primary); cursor: pointer; border: none;
  }
  input[type="range"]::-moz-range-thumb {
    width: 18px; height: 18px; border-radius: 50%;
    background: var(--primary); cursor: pointer; border: none;
  }

  .presets { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 14px; }
  .preset {
    background: var(--btn-bg);
    color: var(--btn-text);
    border: 1px solid var(--btn-border);
    border-radius: 6px;
    padding: 8px 0;
    font-size: 14px;
    font-weight: 600;
    text-align: center;
    cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .preset:hover { border-color: var(--primary); }
  .preset.active { border-color: var(--primary); box-shadow: inset 0 0 0 1px var(--primary); }

  .reset {
    display: block; width: 100%; margin-top: 12px;
    background: var(--accent); color: #fff;
    border: none; padding: 10px;
    font-size: 15px; font-weight: 700; text-align: center;
    border-radius: 8px; cursor: pointer;
    transition: background .15s;
  }
  .reset:hover { background: var(--accent-h); }

  #status {
    text-align: center; margin-top: 8px;
    font-weight: 600; font-size: 13px;
    color: var(--ok); min-height: 16px;
  }

  .keys { list-style: none; }
  .key-item { display: flex; align-items: center; padding: 4px 0; }
  .key {
    background: var(--key-bg);
    border: 1px solid var(--key-border);
    color: var(--key-text);
    border-radius: 5px;
    padding: 3px 0; width: 30px;
    font-size: 13px; font-weight: 700; text-align: center;
    margin-right: 12px;
    font-family: monospace;
    flex-shrink: 0;
  }
  .key-desc { font-size: 14px; color: var(--text); }
</style>
</head>
<body>

<div class="header">
  <h1>SpeedAllVideo</h1>
</div>

<!-- Carte vitesse -->
<div class="card">
  <div class="label">Current Speed</div>
  <div class="speed" id="speed">1.00x</div>

  <div class="row">
    <button class="step-btn" id="minus" aria-label="Ralentir">−</button>
    <input type="range" id="slider" min="0.25" max="4" step="0.25" value="1">
    <button class="step-btn" id="plus" aria-label="Accélérer">+</button>
  </div>

  <div class="presets">
    <button class="preset" data-speed="0.25">0.25</button>
    <button class="preset" data-speed="0.5">0.5</button>
    <button class="preset" data-speed="0.75">0.75</button>
    <button class="preset" data-speed="1.0">1.0</button>
    <button class="preset" data-speed="1.5">1.5</button>
    <button class="preset" data-speed="1.75">1.75</button>
    <button class="preset" data-speed="2.0">2.0</button>
    <button class="preset" data-speed="3.0">3.0</button>
  </div>

  <button class="reset" id="reset">Reset (1.0x)</button>
  <div id="status"></div>
</div>

<!-- Carte raccourcis -->
<div class="card">
  <div class="label">Keyboard Shortcuts</div>
  <ul class="keys">
    <li class="key-item">
      <span class="key">S</span>
      <span class="key-desc">Slow down (−0.25x)</span>
    </li>
    <li class="key-item">
      <span class="key">D</span>
      <span class="key-desc">Speed up (+0.25x)</span>
    </li>
    <li class="key-item">
      <span class="key">R</span>
      <span class="key-desc">Reset speed (1x)</span>
    </li>
  </ul>
</div>

<script src="popup.js"></script>
</body>
</html>
