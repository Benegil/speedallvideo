<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SpeedAllVideo</title>
<style>
  :root {
    --bg: #e9eaec;
    --card-bg: #ffffff;
    --text: #222;
    --text-secondary: #555;
    --border: #dcdfe3;
    --primary: #2b7de9;
    --primary-hover: #1f68c9;
    --accent: #f2733d;
    --accent-hover: #e0622c;
    --btn-bg: #ffffff;
    --btn-text: #222;
    --btn-border: #d4d7dc;
    --slider-track: #d9dce1;
    --shortcut-key-bg: #eceef1;
    --shortcut-key-border: #cfd3d9;
    --shortcut-key-text: #333;
    --status-ok: #28a745;
    --shadow: 0 1px 4px rgba(0,0,0,.10);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #191b1e;
      --card-bg: #2a2d31;
      --text: #e4e6e9;
      --text-secondary: #9aa0a8;
      --border: #3d4147;
      --primary: #6ea8fe;
      --primary-hover: #5a93e0;
      --accent: #ff8b4d;
      --accent-hover: #f2733d;
      --btn-bg: #34383d;
      --btn-text: #e4e6e9;
      --btn-border: #4a4f56;
      --slider-track: #4a4f56;
      --shortcut-key-bg: #3a3e44;
      --shortcut-key-border: #565b62;
      --shortcut-key-text: #e4e6e9;
      --status-ok: #5cdb7a;
      --shadow: 0 1px 4px rgba(0,0,0,.35);
    }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    width: 340px;
    padding: 16px 12px;
  }

  /* ---- En-tête : titre + badge rond ---- */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
    padding: 0 2px;
  }
  h1 {
    font-size: 17px;
    font-weight: 700;
    color: var(--primary);
  }
  .header-badge {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: var(--primary);
    color: #fff;
    font-size: 16px;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  /* ---- Cartes ---- */
  .card {
    background: var(--card-bg);
    border-radius: 12px;
    box-shadow: var(--shadow);
    padding: 16px 14px;
  }
  .card + .card { margin-top: 12px; }

  .section-label {
    font-size: 12px;
    font-weight: 700;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: .5px;
    margin-bottom: 8px;
  }

  /* ---- Vitesse courante ---- */
  .speed-value {
    text-align: center;
    font-size: 42px;
    font-weight: 700;
    color: var(--primary);
    line-height: 1.1;
    margin-bottom: 12px;
  }

  /* ---- Slider ---- */
  .slider-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .slider-btn {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: none;
    background: var(--primary);
    color: #fff;
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
    text-align: center;
    flex-shrink: 0;
    transition: background .15s;
  }
  .slider-btn:hover { background: var(--primary-hover); }

  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    flex: 1;
    min-width: 0;
    height: 6px;
    border-radius: 3px;
    background: var(--slider-track);
    outline: none;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--primary);
    cursor: pointer;
    border: none;
  }
  input[type="range"]::-moz-range-thumb {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--primary);
    cursor: pointer;
    border: none;
  }

  /* ---- Boutons de vitesse prédéfinis ---- */
  .presets {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-top: 14px;
  }
  .preset-btn {
    background: var(--btn-bg);
    color: var(--btn-text);
    border: 1px solid var(--btn-border);
    border-radius: 6px;
    padding: 8px 0;
    font-size: 14px;
    font-weight: 600;
    text-align: center;
    cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .preset-btn:hover { border-color: var(--primary); }
  .preset-btn.active {
    border-color: var(--primary);
    box-shadow: inset 0 0 0 1px var(--primary);
  }

  /* ---- Reset ---- */
  .reset-btn {
    display: block;
    width: 100%;
    margin-top: 12px;
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 10px;
    font-size: 15px;
    font-weight: 700;
    text-align: center;
    border-radius: 8px;
    cursor: pointer;
    transition: background .15s;
  }
  .reset-btn:hover { background: var(--accent-hover); }

  /* ---- Status ---- */
  #status {
    text-align: center;
    margin-top: 8px;
    font-weight: 600;
    font-size: 13px;
    color: var(--status-ok);
    min-height: 16px;
  }

  /* ---- Raccourcis clavier ---- */
  .shortcut-list { list-style: none; }
  .shortcut-item {
    display: flex;
    align-items: center;
    padding: 4px 0;
  }
  .shortcut-key {
    background: var(--shortcut-key-bg);
    border: 1px solid var(--shortcut-key-border);
    color: var(--shortcut-key-text);
    border-radius: 5px;
    padding: 3px 0;
    width: 30px;
    font-size: 13px;
    font-weight: 700;
    text-align: center;
    margin-right: 12px;
    font-family: monospace;
    flex-shrink: 0;
  }
  .shortcut-desc {
    font-size: 14px;
    color: var(--text);
  }
</style>
</head>
<body>

<div class="header">
  <h1>SpeedAllVideo</h1>
  <div class="header-badge" title="SpeedAllVideo">X</div>
</div>

<!-- Carte vitesse -->
<div class="card">
  <div class="section-label">Current Speed</div>
  <div class="speed-value" id="currentSpeed">1.00x</div>

  <div class="slider-row">
    <button class="slider-btn" id="minusBtn" aria-label="Ralentir">−</button>
    <input type="range" id="speedSlider" min="0.25" max="4" step="0.25" value="1">
    <button class="slider-btn" id="plusBtn" aria-label="Accélérer">+</button>
  </div>

  <!-- Boutons prédéfinis -->
  <div class="presets">
    <button class="preset-btn" data-speed="0.25">0.25</button>
    <button class="preset-btn" data-speed="0.5">0.5</button>
    <button class="preset-btn" data-speed="1.0">1.0</button>
    <button class="preset-btn" data-speed="1.5">1.5</button>
    <button class="preset-btn" data-speed="2.0">2.0</button>
    <button class="preset-btn" data-speed="3.0">3.0</button>
  </div>

  <!-- Reset -->
  <button class="reset-btn" id="resetBtn">Reset (1.0x)</button>

  <div id="status"></div>
</div>

<!-- Carte raccourcis -->
<div class="card">
  <div class="section-label">Keyboard Shortcuts</div>
  <ul class="shortcut-list">
    <li class="shortcut-item">
      <span class="shortcut-key">S</span>
      <span class="shortcut-desc">Slow down (−0.25x)</span>
    </li>
    <li class="shortcut-item">
      <span class="shortcut-key">D</span>
      <span class="shortcut-desc">Speed up (+0.25x)</span>
    </li>
    <li class="shortcut-item">
      <span class="shortcut-key">R</span>
      <span class="shortcut-desc">Reset speed (1x)</span>
    </li>
  </ul>
</div>

<script src="popup.js"></script>
</body>
</html>
